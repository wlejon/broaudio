version: 2

# The actions in .github/workflows/ carry pinned versions here; libremidi is
# pinned in CMakeLists.txt (bro_dependency) and the bro siblings track their main. SDL3 is provisioned by the
# pinned setup-sdl step in the workflows, so bumping it is a github-actions
# concern too. dr_libs and nlohmann are vendored single headers with no manifest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"